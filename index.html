<style>
  :root { --bg:#0c0d12; --card:#151722; --gold:#F5B93E; --orange:#FF7A1A; --violet:#8B5CF6; --text:#fff; --muted:#9aa0b4; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Tahoma,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { width:100%; max-width:380px; background:var(--card); border:1px solid rgba(245,185,62,.25); border-radius:28px; padding:32px 22px; text-align:center; box-shadow:0 20px 60px rgba(255,122,26,.12); }
  .logo { width:96px; height:96px; border-radius:24px; display:block; margin:0 auto 16px; box-shadow:0 8px 30px rgba(255,122,26,.35); }
  h1 { font-size:28px; font-weight:900; letter-spacing:1px; }
  h1 span { color:var(--gold); }
  .msg { color:var(--muted); font-size:15px; line-height:1.7; margin:12px 0 24px; }
  .btn { display:block; width:100%; padding:15px; border-radius:18px; font-size:16px; font-weight:800; text-decoration:none; color:#fff; background:linear-gradient(135deg,var(--orange),var(--violet)); }
  .btn.disabled { opacity:.55; pointer-events:none; }
  .soon { color:var(--gold); font-size:13px; margin-top:12px; }
  .en { direction:ltr; color:var(--muted); font-size:13px; margin-top:22px; line-height:1.6; }
</style>
</head>
